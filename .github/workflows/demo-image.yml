name: demo-image

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "eval/out/20261025-full/results.json"
      - ".github/workflows/demo-image.yml"
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: HTTP contract tests (no weights needed)
        run: |
          python -m pip install --quiet fastapi 'uvicorn[standard]' httpx pytest
          python -m pytest demo/test_app.py -q

      - name: Build the serving image
        run: docker build -f demo/Dockerfile -t si-demo .

      - name: Start the container
        run: docker run -d --name si-demo -p 8000:8000 si-demo

      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS localhost:8000/health > /tmp/health.json; then
              cat /tmp/health.json
              break
            fi
            sleep 3
          done
          test -s /tmp/health.json

      - name: The model must actually be loaded
        run: |
          python - <<'PY'
          import json
          body = json.load(open("/tmp/health.json"))
          assert body["model_loaded"] is True, body
          assert body["audit_loaded"] is True, body
          print("model and audit loaded")
          PY

      - name: Score a real post and check against the committed prediction
        run: |
          set -euo pipefail
          curl -fsS -X POST localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"text":"gue udah gakuat hidup lagi sedih banget bjir slalu diasingkan mending bundir aja"}' \
            -o /tmp/pos.json
          curl -fsS -X POST localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"text":"tak tahu la kenapa hati ni jadi si keras ni mungkin dah mati rasa"}' \
            -o /tmp/neg.json
          python - <<'PY'
          import json
          pos = json.load(open("/tmp/pos.json"))["probability_positive"]
          neg = json.load(open("/tmp/neg.json"))["probability_positive"]
          print(f"positive={pos:.4f} negative={neg:.4f}")
          assert abs(pos - 0.9986) <= 0.02, pos
          assert abs(neg - 0.0005) <= 0.02, neg
          PY

      - name: Container logs on failure
        if: failure()
        run: docker logs si-demo || true

      - name: Stop the container
        if: always()
        run: docker rm -f si-demo || true
